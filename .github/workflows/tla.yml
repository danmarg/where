name: TLA+ model

# Model-checks formal/tla/WhereSync.tla (delivery, epochs and acks; spec §5.4) with TLC at the
# small bounds in the checked-in configurations. The model is hand-written, not generated, so it
# also runs when the protocol code it mirrors changes: a change there should come with a change
# here (or a reason why not).
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'formal/**'
      # The code the model mirrors: protocol, persistence and outbox (e2ee/, sqldelight/),
      # client orchestration (LocationClient, polling and acks, elsewhere in commonMain) and the
      # mailbox server (GET window, TTL, idempotent PUT). README.md maps each assumption to it.
      - 'shared/src/commonMain/**'
      - 'server/src/main/**'
      - 'docs/e2ee-location-sync.md'
      - '.github/workflows/tla.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The last stable TLA+ tools release, pinned by hash (v1.8.0 is a rolling prerelease).
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [ WhereSyncSafety, WhereSyncSafetyLoss, WhereSyncSafetyReject, WhereSyncSafetyTTL, WhereSyncSafetyDeep, WhereSyncLiveness, WhereSyncFairness, WhereSyncFairnessConverse ]
    name: tlc (${{ matrix.config }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch TLA+ tools
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -

      - name: Run TLC
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: formal/tla/run-tlc.sh ${{ matrix.config }}.cfg

  # Each property must catch the bug it is there for (one mutant per rule), and each configuration
  # must reach the behaviours it claims to cover (reachability probes): check-mutants.py.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch TLA+ tools
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -

      - name: Check mutants
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: python3 formal/tla/check-mutants.py

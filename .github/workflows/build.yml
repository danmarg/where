name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same PR/branch cancels the run it supersedes. macOS runners are capped at
  # 5 concurrent jobs, so stale runs otherwise queue everything behind them.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest runners ship with an Android SDK preinstalled (ANDROID_HOME
      # already set). android-actions/setup-android@v3 unconditionally tries to
      # install the legacy "tools" package, which Google has removed from the
      # SDK repository, so it fails outright. Use the preinstalled SDK instead
      # and just fetch the platform we build against.
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Install libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      # assembleDebug pulls in the gms-flavor variants too, which fail fast without a
      # MAPS_API_KEY (intentionally — see android/build.gradle.kts). CI has no such secret
      # by design, so build the fdroid flavor, which doesn't need one.
      - name: Build debug APK
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        run: ./gradlew :android:assembleStandardFdroidDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/standardFdroid/debug/*.apk
          retention-days: 14

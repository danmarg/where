name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the same PR/branch cancels the run it supersedes. macOS runners are capped at
  # 5 concurrent jobs, so stale runs otherwise queue everything behind them.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest runners ship with an Android SDK preinstalled (ANDROID_HOME
      # already set). android-actions/setup-android@v3 unconditionally tries to
      # install the legacy "tools" package, which Google has removed from the
      # SDK repository, so it fails outright. Use the preinstalled SDK instead
      # and just fetch the platform we build against.
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Install libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Run ktlint
        run: ./gradlew :server:ktlintCheck :android:ktlintCheck :cli:ktlintCheck :shared:ktlintCheck

      - name: Run shared + server tests (JVM)
        run: |
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          ./gradlew :shared:jvmTest :server:test

      - name: Run Android unit tests
        # fullFdroid is intentionally omitted: the variant is disabled in build.gradle.kts
        # (F-Droid ships standardFdroid only; fullFdroid has no published use case).
        run: ./gradlew :android:testStandardGmsDebugUnitTest :android:testStandardFdroidDebugUnitTest :android:testFullGmsDebugUnitTest

      - name: Run E2E CLI test
        run: |
          chmod +x ./e2e-test.sh
          ./e2e-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
          retention-days: 7

  compat:
    # The CLI from the last release (latest v* tag) against this commit's CLI and server:
    # in-place upgrade with a live session, and pairing across versions. See compat-test.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the release tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK platform
        # Gradle configures :android even when only building the CLI and server.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Run cross-version compat test
        run: ./compat-test.sh

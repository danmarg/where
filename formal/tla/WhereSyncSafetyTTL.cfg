\* Safety with TTL expiry (the clock reaches TTL, so anything posted at time 0 can expire) and a
\* crash. NoStrandedMessages only constrains runs where nothing expired. ~0.7M distinct states, ~30 s.
CONSTANTS
    MaxSends = 2
    MaxUrgent = 0
    MaxCrashes = 1
    MaxLoss = 0
    MaxDup = 0
    MaxClock = 2
    TTL = 2
    SkipCap = 2
    ForceAckAfter = 2
INIT Init
NEXT Next
INVARIANTS TypeOK NoDoubleAccept SkippedWithinCap RatchetSound AcksOnlyProcessed NoStrandedMessages NoSilentDrop NoUnreadAcks
CHECK_DEADLOCK FALSE

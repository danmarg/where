\* Safety with crashes, duplicates and StoppedSharing sends (which skip the empty-outbox gate).
\* ~1.1M distinct states, ~1 min on 4 cores.
CONSTANTS
    MaxSends = 2
    MaxUrgent = 1
    MaxCrashes = 1
    MaxLoss = 0
    MaxDup = 1
    MaxClock = 0
    TTL = 2
    SkipCap = 2
    ForceAckAfter = 2
INIT Init
NEXT Next
INVARIANTS TypeOK NoDoubleAccept SkippedWithinCap RatchetSound AcksOnlyProcessed NoStrandedMessages NoSilentDrop NoUnreadAcks CachedKeysUsable
CHECK_DEADLOCK FALSE

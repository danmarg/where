\* Fairness: the hand-written WFProcess and TLC's WF_vars(Process) imply each other (see the
\* comment above FairnessWF). Small bounds (~2K states, ~3 min): TLC 1.7.4 evaluates ENABLED
\* Process by running the batch decryption in every state.
CONSTANTS
    MaxSends = 2
    MaxUrgent = 0
    MaxCrashes = 0
    MaxLoss = 0
    MaxDup = 0
    MaxClock = 0
    TTL = 1
    SkipCap = 2
    ForceAckAfter = 2
SPECIFICATION SpecWF
PROPERTIES WFProcessAll AllDelivered EventuallyKnowsSentKeys
CHECK_DEADLOCK FALSE

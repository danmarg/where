\* Safety on the paths only gaps past the skipped-key cap reach: two lost messages against a cap
\* of 1, so frames are rejected, stay on the server, and are force-ACKed after silent polls.
CONSTANTS
    MaxSends = 3
    MaxUrgent = 0
    MaxCrashes = 0
    MaxLoss = 2
    MaxDup = 0
    MaxClock = 0
    TTL = 2
    SkipCap = 1
    ForceAckAfter = 2
INIT Init
NEXT Next
INVARIANTS TypeOK NoDoubleAccept SkippedWithinCap RatchetSound AcksOnlyProcessed NoStrandedMessages NoSilentDrop NoUnreadAcks ForceAckOnlyUnprocessable
CHECK_DEADLOCK FALSE

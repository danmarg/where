\* Safety with a lost message, a duplicate and a crash, and three sends per client: enough to open
\* gaps (skipped keys, the previous-chain gap fill, the cache path, frames over the skipped-key cap).
\* ~3.9M distinct states, ~4 min on 4 cores.
CONSTANTS
    MaxSends = 3
    MaxUrgent = 0
    MaxCrashes = 1
    MaxLoss = 1
    MaxDup = 1
    MaxClock = 0
    TTL = 2
    SkipCap = 2
    ForceAckAfter = 2
INIT Init
NEXT Next
INVARIANTS TypeOK NoDoubleAccept SkippedWithinCap RatchetSound AcksOnlyProcessed NoStrandedMessages NoSilentDrop
CHECK_DEADLOCK FALSE

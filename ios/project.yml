name: Where
options:
  bundleIdPrefix: net.af0
  deploymentTarget:
    iOS: "17.0"

settings:
  SWIFT_VERSION: "6.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  OTHER_LDFLAGS: $(inherited)
  ENABLE_PREVIEWS: NO
  LD: $(DT_TOOLCHAIN_DIR)/usr/bin/clang

targets:
  Where:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Where
    resources:
      - path: Sources/Where/Assets.xcassets
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    preBuildScripts:
      - name: Build KMP Shared XCFramework
        script: |
          cd "$SRCROOT/.."
          if [ -f .envrc ]; then
            source .envrc
          fi
          # Build BOTH to avoid switching issues
          ./gradlew :shared:assembleSharedDebugXCFramework :shared:assembleSharedReleaseXCFramework
    postBuildScripts:
      # Records the commit the app was built from (shown under the Friends list), so a crash
      # report or TestFlight build can be traced to its source. Runs before code signing.
      - name: Stamp Git Commit
        basedOnDependencyAnalysis: false
        script: |
          repo="$SRCROOT/.."
          commit=$(git -C "$repo" rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$repo" status --porcelain --untracked-files=no 2>/dev/null)" ]; then
            commit="$commit-dirty"
          fi
          /usr/libexec/PlistBuddy -c "Set :WhereGitCommit $commit" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    dependencies:
      - framework: ../shared/build/XCFrameworks/$(CONFIGURATION:lower)/Shared.xcframework
        embed: true
      - framework: Security
        embed: false
      - framework: MapKit
        embed: false
      - framework: CoreLocation
        embed: false
      - framework: CoreMotion
        embed: false
    info:
      path: Sources/Where/Info.plist
      useBaseInternationalization: true
      appIcon: AppIcon
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - pt
          - ja
          - zh-Hans
        NSLocationWhenInUseUsageDescription: "Where needs your location to show it on the map."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Where needs your location in the background to keep sharing it."
        NSCameraUsageDescription: "Where needs the camera to scan friend invite QR codes."
        NSMotionUsageDescription: "Where uses motion data to optimize battery usage by reducing GPS activity when you are stationary."
        BGTaskSchedulerPermittedIdentifiers:
          - net.af0.where.heartbeat
        UIBackgroundModes:
          - fetch
          - location
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchStoryboardName: BrandLaunch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WhereGitCommit: unknown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Sources/Where/Where.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:where.af0.net
          - applinks:where.af0.net?mode=developer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.af0.WhereApp
      FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/XCFrameworks/$(CONFIGURATION:lower)
      CODE_SIGN_IDENTITY: Apple Development
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.34"
      CURRENT_PROJECT_VERSION: 64

  WhereTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Where
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.af0.WhereTests
      GENERATE_INFOPLIST_FILE: YES

# Shared, so `xcodebuild -scheme Where` (fastlane, CI, scripts) never depends on a scheme Xcode
# autocreated or one in someone's xcuserdata.
schemes:
  Where:
    build:
      targets:
        Where: all
        WhereTests: [test]
    run:
      config: Debug
      # Set WHERE_SERVER_HTTP_URL in ios/Local.xcconfig (gitignored) to point a run at another
      # server, e.g. a LAN address for a device; unset, it expands to "" and ServerConfig ignores it.
      # (xcodegen rewrites this scheme, so edits made to it in Xcode don't last.)
      environmentVariables:
        WHERE_SERVER_HTTP_URL: $(WHERE_SERVER_HTTP_URL)
    test:
      config: Debug
      targets:
        - WhereTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

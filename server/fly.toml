# fly.toml app configuration file generated for where-api on 2026-04-02T20:57:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'where-api'
primary_region = 'fra'

[env]
  # Phase A of the Redis -> DynamoDB mailbox store migration (PR #340): Redis stays
  # authoritative for every request. DynamoDB mirrors every write best-effort and gets
  # shadow-read-compared on every drain(), off the request path - a DynamoDB failure can
  # only produce a WARN log, never affect a client response. "Zero WARN lines" over the
  # wait-out-TTL period is the parity signal before flipping to dual-write-dynamodb-primary.
  MAILBOX_STORE_MODE = 'dual-write-redis-primary'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpus = 1
  memory_mb = 256

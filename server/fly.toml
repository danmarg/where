# fly.toml app configuration file generated for where-api on 2026-04-02T20:57:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'where-api'
primary_region = 'fra'

[env]
  # Redis -> DynamoDB mailbox store migration (PR #340) complete: DynamoDB alone is
  # authoritative. Ran as dual-write-redis-primary then dual-write-dynamodb-primary for
  # several weeks first, validated via shadow-read comparison on every drain() - see
  # docs/e2ee-location-sync.md and the migration history in git log for server/fly.toml.
  MAILBOX_STORE_MODE = 'dynamodb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpus = 1
  memory_mb = 512
